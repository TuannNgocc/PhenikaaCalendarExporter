        }
      }
    },
    "/api/v1/sessions/{sessionId}/exports/{filename}": {
      "get": {
        "tags": [
          "Sessions"
        ],
        "summary": "Download an existing export",
        "parameters": [
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "filename",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "calendar.json",
                "calendar.ics",
                "calendar.xlsx"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Calendar export file"
          },
          "401": {
            "description": "Authentication required"
          },
          "404": {
            "description": "Export not available"
          }
        }
      }
    },
    "/api/v1/sessions/{sessionId}/sync": {
      "post": {
        "tags": [
          "Sync"
        ],
        "summary": "Request a session sync",
        "parameters": [
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "202": {
            "description": "Sync request accepted"
          },
          "409": {
            "description": "Sync could not be queued"
          }
        }
      }
    },
    "/api/v1/sessions/{sessionId}/sync/runs": {
      "get": {
